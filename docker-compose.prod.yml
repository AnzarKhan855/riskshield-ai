version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: riskshield_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riskshield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskshield_password}
      POSTGRES_DB: ${POSTGRES_DB:-riskshield_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riskshield_user} -d ${POSTGRES_DB:-riskshield_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: riskshield_redis_prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: riskshield_backend_prod
    restart: always
    environment:
      ENVIRONMENT: production
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-riskshield_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riskshield_password}
      POSTGRES_DB: ${POSTGRES_DB:-riskshield_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-production_super_secret_jwt_key_change_me}
      BACKEND_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: riskshield_frontend_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:
