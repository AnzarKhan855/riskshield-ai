name: Security & Vulnerability Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC

jobs:
  npm-audit:
    name: Frontend NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run NPM Audit
        run: |
          cd frontend
          npm audit --audit-level=critical || true

  pip-security:
    name: Backend Dependency & Code Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit & bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      - name: Run Bandit AST Security Analysis
        run: |
          bandit -r backend/app -ll -ii || true
