name: 🐛 Bug Report
description: Report a reproducible bug or defect in RiskShield AI
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and resolve the bug quickly.
  - type: input
    id: version
    attributes:
      label: RiskShield AI Version
      description: What version or commit of RiskShield AI are you running?
      placeholder: e.g. v1.0.0 or commit hash
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Select the module where the defect occurs.
      options:
        - Decision Engine (AST / Rules)
        - ML Inference Mesh (XGBoost / ONNX / LGBM)
        - AI Intelligence Hub & Copilot
        - TreeSHAP Explainability
        - Feature Store & Velocity Cache
        - Case Management Workspace
        - Graph Intelligence
        - Next.js Web Console
        - REST API Gateway
        - Docker & Deployment
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Ingest transaction via POST /api/v1/decisions/evaluate
        2. Inspect decision response
        3. Observe error code...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Stack Trace
      description: Paste relevant server or browser console logs here.
      render: shell
